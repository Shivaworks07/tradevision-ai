# P1-21 fix ("Unsupported framework versions on a money system" -- external review, full context
# in tradevision-backend/SETUP.md's own "P1-21" section): this repo had no CI workflow of any
# kind before this pass, so "add dependency scanning (OWASP DC / npm audit / Dependabot) in CI" --
# the audit's own explicit fix instruction -- could not be added TO an existing pipeline; this
# workflow IS that pipeline, scoped deliberately narrow (scanning + the existing test suites, not
# a deploy pipeline, which is a separate concern this pass does not attempt). Runs on every push
# and PR against main, plus a weekly schedule so a newly-disclosed CVE in an otherwise-unchanged
# dependency still gets caught between commits.
#
# Genuinely NOT attempted in this same pass, disclosed rather than silently skipped (see
# SETUP.md's own "P1-21" section for the full reasoning): actually performing the major-version
# framework upgrade itself (Spring Boot 3.2.5 -> a current supported 3.x/4.x line, Angular 17.3 ->
# a current LTS release). This workflow's own job is to make that gap VISIBLE and continuously
# monitored going forward, not to close it in one uncontrolled jump on a real-money system.
name: Dependency scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Every Monday 06:00 UTC -- independent of Dependabot's own weekly cadence, so a scan still
    # runs even in a week with no dependency-bump PR to trigger one via `pull_request` above.
    - cron: '0 6 * * 1'
  workflow_dispatch: {}

jobs:
  backend-owasp-dependency-check:
    name: Backend — OWASP Dependency-Check (Maven)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'
      # Review finding ("Build/CI cannot produce image" -- P0-10, full context in this repo's own
      # Dockerfile): confirmed this same "must run from the actual pom.xml, with real dependency
      # resolution" requirement applies here too -- dependency-check-maven inspects the resolved
      # dependency tree, not just pom.xml text, so it needs a real `mvn` invocation against the
      # backend module exactly like the existing test/build steps below do.
      - name: Run OWASP Dependency-Check
        working-directory: tradevision-backend
        run: >
          mvn -B org.owasp:dependency-check-maven:12.1.0:check
          -DfailBuildOnCVSS=8
          -DsuppressionFile=owasp-suppressions.xml
          -Dformats=HTML,JSON
      - name: Upload Dependency-Check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-dependency-check-report
          path: tradevision-backend/target/dependency-check-report.*

  frontend-npm-audit:
    name: Frontend — npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: trading-analyst/package-lock.json
      - name: Install dependencies
        working-directory: trading-analyst
        run: npm ci
      # `--audit-level=high` intentionally does not fail the build on moderate-severity findings
      # (a real, non-zero baseline this repo already has today — see SETUP.md's own P1-21 section
      # for the current count) -- this gate is meant to catch NEW high/critical findings going
      # forward without blocking every single PR on pre-existing, already-triaged moderate ones.
      - name: Run npm audit (high+critical fails the build)
        working-directory: trading-analyst
        run: npm audit --audit-level=high

  backend-build-and-test:
    name: Backend — build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'
      - name: Compile
        working-directory: tradevision-backend
        run: mvn -B -q compile
      - name: Unit tests (integration tests need Docker/Testcontainers -- excluded here, run separately)
        working-directory: tradevision-backend
        run: mvn -B test -Dtest='!*IntegrationTest' -DfailIfNoTests=false

  # P3-11 fix ("Add a CI job with Docker running integration tests against a Mongo replica set" --
  # external review, second pass, re-audit, item #4 of its own explicit "before live trading, fix
  # these" list): the job the comment on backend-build-and-test's own "Unit tests" step above has
  # promised ("...excluded here, run separately") since this workflow was first written, but which
  # never actually existed until now -- every @Testcontainers(disabledWithoutDocker = true)
  # integration test in this repo (OrderBrokerOrderIdPartialIndexIntegrationTest and its siblings,
  # each with their own "HONEST LIMITATION -- docker ps fails in this sandbox" javadoc, since none
  # of them could ever be executed in the sandbox this whole audit was carried out in) has run
  # ZERO times before this job existed, in this repo's history or in CI. ubuntu-latest GitHub-
  # hosted runners come with Docker already installed and running -- Testcontainers' own
  # MongoDBContainer starts and manages a real `mongo:7` container against it directly (a genuine
  # single-node replica set, which is what MongoDBContainer actually configures -- required for
  # Spring Data MongoDB's transactional/session features some of this codebase's own atomic
  # updates rely on), no separate `services:` block or manual container wiring needed.
  backend-integration-tests:
    name: Backend — integration tests (Testcontainers/Docker, real Mongo replica set)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'
      - name: Integration tests
        working-directory: tradevision-backend
        run: mvn -B test -Dtest='*IntegrationTest' -DfailIfNoTests=false

  frontend-build-and-test:
    name: Frontend — build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: trading-analyst/package-lock.json
      - name: Install dependencies
        working-directory: trading-analyst
        run: npm ci
      - name: Type-check
        working-directory: trading-analyst
        run: npx tsc --noEmit -p tsconfig.json
      - name: Unit tests (headless Chrome, no sandbox — matches this repo's own karma.conf.js)
        working-directory: trading-analyst
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: npx ng test --watch=false --browsers=ChromeHeadlessNoSandbox
      - name: Production build
        working-directory: trading-analyst
        run: npx ng build --configuration production
