# ── LOCAL DEVELOPMENT ONLY ────────────────────────────────────────────────────
# Every secret below is a randomly-generated, clearly-fake placeholder committed to this repo on
# purpose so opening this project in IntelliJ and hitting Run works with ZERO extra setup —
# there is nothing real to protect here. NEVER reuse any of these values, or this file's pattern
# of committing secrets directly, in application-prod.properties or any real deployment — that
# file deliberately requires every secret to come from a real environment variable instead, and
# refuses to start without them. That difference is the whole point of splitting these files.
#
# Requires a local MongoDB reachable at localhost:27017 — the quickest way to get one:
#   docker run -d --name tradevision-mongo -p 27017:27017 mongo:7
# P1-16 fix ("Committed secrets + 'local' as default profile"): this profile is NO LONGER
# activated automatically. application.properties now defaults spring.profiles.active to "prod"
# (fail-closed: application-prod.properties throws on startup if its required env vars aren't
# set, rather than silently running with this file's own public, committed dev secrets) — you
# must explicitly opt in to local development:
#   export SPRING_PROFILES_ACTIVE=local
# (or the IntelliJ/IDE equivalent: add SPRING_PROFILES_ACTIVE=local to your run configuration's
# environment variables). See application.properties' own updated comment for the full reasoning.

spring.data.mongodb.uri=mongodb://localhost:27017/trade_vision

app.jwt.secret=p9b28r5s+b0fz+BhL51ef1y7wfpKZr5W/8tEDHVjxZk=

app.encryption.key=FVzfJYk/8RCI4V0V1Jy3vk50Ni7fJg1GspyINhozLLk=
# P2-6 fix ("CredentialEncryptionService: no key id/version" -- external review, full context in
# that class's own header javadoc): names which key app.encryption.key currently is, embedded in
# every new ciphertext so a future key rotation can tell old and new ciphertexts apart. Defaults
# to "v1" if unset -- set explicitly here for clarity, not because a different value is required.
app.encryption.key-id=v1
# app.encryption.previous-keys=v1=FVzfJYk/8RCI4V0V1Jy3vk50Ni7fJg1GspyINhozLLk= -- populate this
# (format: keyId1=base64key1,keyId2=base64key2) only once app.encryption.key/-key-id above have
# actually been rotated to a NEW key, so ciphertext still under the retired key can still be
# decrypted (and re-encrypted under the new key via CredentialEncryptionService.
# reencryptWithCurrentKey) until every row has been migrated off it.

app.admin.bootstrap-secret=ev0/Nk5FhRBgIx5cNEfDq1iQU+dEcZTIet58FsxJWME=

# No real email/SMS provider needed for local dev — OTPs print straight to the console instead
# (see app.otp.allow-console-fallback below). mail.enabled stays false, so EmailService never
# attempts a real Brevo API call.
mail.enabled=false
brevo.api.key=
brevo.from.email=dev@localhost

# Angular dev server default port.
app.cors.allowed-origins=http://localhost:4200,http://localhost:4201

app.otp.hmac-secret=Qknh9d9kZrg1TsuqJLIW5RF7BtFFByTRGf93EnjwxsQ=
sms.provider=console
# Review finding ("OTP is STILL printed to console"): this is the ONE place across all three
# properties files where this should ever be true — the explicit, deliberate local-dev opt-in.
# Prints the real OTP to the console/log for both the SMS and email fallback paths so you can
# actually log in locally without a real provider account. If you ever see an OTP in a log
# outside this file, something is misconfigured — see SETUP.md.
app.otp.allow-console-fallback=true

# Full Swagger UI for local exploration: http://localhost:8080/swagger-ui.html
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# Not behind any proxy locally — the default (false) is correct here, listed for clarity.
app.proxy.trust-forwarded-for=false
# P2-9 fix: unused while trust-forwarded-for is false above, listed for clarity/discoverability.
app.proxy.trusted-proxy-cidrs=

# More detail locally than you'd want in production logs.
logging.level.com.tradevision=DEBUG
