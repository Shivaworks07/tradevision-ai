# ── PRODUCTION — every value below MUST come from a real environment variable ───────────
# If any required variable is missing, Spring throws on an unresolved placeholder and the app
# refuses to start — that is the correct failure mode. Never put a real secret directly in this
# file; see SETUP.md for the full list of variables this profile requires.
# P1-16 fix ("Committed secrets + 'local' as default profile"): this is now the DEFAULT profile
# (application.properties: spring.profiles.active=${SPRING_PROFILES_ACTIVE:prod}) — the
# Dockerfile still sets SPRING_PROFILES_ACTIVE=prod explicitly too, but that is now redundant
# defense-in-depth rather than the only thing standing between a misconfigured deployment and
# this application's own committed local-dev secrets. Any run that forgets to set
# SPRING_PROFILES_ACTIVE at all now lands HERE, fails closed on a missing env var, and refuses
# to start — never silently falls back to application-local.properties' own public secrets.

# Spring Boot 4 follow-up: spring.data.mongodb.* renamed to spring.mongodb.* (see
# application.properties' own updated comment for full context).
spring.mongodb.uri=${MONGODB_URI}

app.jwt.secret=${JWT_SECRET}

# Broker credential encryption (AES-256-GCM). Generate with: openssl rand -base64 32
app.encryption.key=${APP_ENCRYPTION_KEY}
# P2-6 fix ("CredentialEncryptionService: no key id/version" -- full context in that class's own
# header javadoc): defaults to "v1" so an existing deployment that has never set APP_ENCRYPTION_
# KEY_ID keeps working unchanged. Bump this (to a new value, alongside a new APP_ENCRYPTION_KEY)
# when actually rotating the key -- old ciphertext then needs APP_ENCRYPTION_PREVIOUS_KEYS set to
# the retired keyId=key pair until every row is migrated (see reencryptWithCurrentKey).
app.encryption.key-id=${APP_ENCRYPTION_KEY_ID:v1}
app.encryption.previous-keys=${APP_ENCRYPTION_PREVIOUS_KEYS:}

app.admin.bootstrap-secret=${ADMIN_BOOTSTRAP_SECRET}

mail.enabled=${MAIL_ENABLED:false}
brevo.api.key=${BREVO_API_KEY}
brevo.from.email=${BREVO_FROM_EMAIL}

# CORS
app.cors.allowed-origins=${CORS_ORIGINS}

# OTP
# Review finding ("BLOCKER #5" — OTP stored in plaintext): HMAC key for hashing OTPs before
# storage. Generate with: openssl rand -base64 32
app.otp.hmac-secret=${OTP_HMAC_SECRET}
sms.provider=${SMS_PROVIDER:}
# Review finding ("OTP is STILL printed to console"): must stay false in production — only ever
# set true for local development. See application-local.properties.
app.otp.allow-console-fallback=false

# Review finding ("Public Swagger/OpenAPI in production"): defaults to DISABLED — the safer
# default per review feedback, so a deployment that forgets to touch this config doesn't
# accidentally expose the full OpenAPI spec. When false, springdoc's endpoints don't exist at
# all (not just access-restricted), so this is the actual toggle, not the permitAll entries in
# SecurityConfig, which stay harmless either way.
springdoc.api-docs.enabled=${SPRINGDOC_ENABLED:false}
springdoc.swagger-ui.enabled=${SPRINGDOC_ENABLED:false}

# Review finding ("X-Forwarded-For is potentially spoofable"): only trust this header when
# actually deployed behind a reverse proxy/load balancer that sets it itself.
app.proxy.trust-forwarded-for=${APP_PROXY_TRUST_FORWARDED_FOR:false}
# P2-9 fix ("trust-forwarded-for=false by default; behind a LB all users share one IP" -- full
# context in ClientIpResolver's own class javadoc): comma-separated CIDR(s) of the real reverse
# proxy/load balancer in front of this deployment (e.g. "10.0.0.0/8" for most managed LBs on a
# private VPC, or the specific egress range your infra provider documents). Left blank by default
# -- set this to the real value for your deployment BEFORE setting trust-forwarded-for above to
# true, or X-Forwarded-For is trusted from any source once that flag is on.
app.proxy.trusted-proxy-cidrs=${APP_PROXY_TRUSTED_PROXY_CIDRS:}
