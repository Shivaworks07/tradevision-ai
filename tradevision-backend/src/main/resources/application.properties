# ── Common to every environment ──────────────────────────────────────────
# Environment-specific values (secrets, CORS origins, feature toggles) live in
# application-local.properties and application-prod.properties instead — see SETUP.md.
# P1-16 fix ("Committed secrets + 'local' as default profile" -- confirmed real): this used to
# default to "local" whenever SPRING_PROFILES_ACTIVE was unset, on the reasoning that the
# Dockerfile always overrides it to "prod" for real deployments -- true for THAT one deployment
# path, but not a safe assumption for every way this jar can actually be run: a bare
# `java -jar app.jar` on a server, a different container image, a k8s manifest with a typo'd or
# missing env var, a CI/staging environment nobody thought to configure -- ANY of those would
# silently start with application-local.properties' own publicly-committed JWT secret, AES
# encryption key, admin bootstrap secret, and OTP HMAC key (see that file's own header for why
# they're committed at all), AND print real OTPs straight to the console/logs. Defaulting to
# "prod" instead makes every one of those paths FAIL CLOSED: application-prod.properties (see
# its own header) throws on any unresolved placeholder, so an accidentally-unconfigured
# deployment now refuses to start at all, rather than silently starting with known, public
# secrets protecting real user accounts and real money. The one-time cost: local development now
# requires explicitly exporting SPRING_PROFILES_ACTIVE=local (see SETUP.md and
# application-local.properties' own updated header) -- a small, one-time inconvenience, not an
# ongoing one, and clearly the correct trade-off against a default that can silently expose
# production.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:prod}

spring.application.name=tradevision-backend
server.port=8080
spring.data.mongodb.database=trade_vision

# Review finding (P1 #12 — "Frontend authentication is still localStorage-based"): the full fix
# (short-lived access token + HttpOnly Secure SameSite refresh cookie) needs new backend session
# infrastructure — Set-Cookie handling, a CSRF strategy, CORS credentials, and an Angular-wide
# HTTP change — genuinely out of reach to build and verify correctly without a real deployment
# to test against, not something to fake. This is the bounded piece that IS safe to do now:
# shortening the access token's blast radius if it's ever stolen via XSS. 30 minutes, down from
# 24 hours — the frontend's proactive refresh (AuthService.doRefresh) now fires well before that.
app.jwt.expiration=1800000
app.jwt.refresh-expiration=604800000
mail.from.name=TradeVision AI
app.otp.expiry-minutes=5

# P2-21 fix ("Time handling: LocalDateTime.now() everywhere instead of Instant + explicit
# trading-day zone" -- external review, full context in RiskEngineService's own header javadoc):
# the explicit zone a daily-loss-limit reset's "today" is measured in. UTC by default (a neutral,
# DST-free choice for a 24/7 crypto market with no single exchange trading day) -- override if
# your own operator/user base has a different zone they actually think of as "the trading day."
app.trading.day-zone=UTC

# Logging
logging.level.org.mongodb.driver.cluster=WARN
logging.level.org.mongodb.driver.connection=WARN
logging.level.com.tradevision=INFO
# P2-17 fix ("no correlation IDs" -- external review, full context in CorrelationIdFilter's own
# header javadoc): Spring Boot's own documented mechanism for embedding an MDC value into every
# log line without a full logback.xml -- CorrelationIdFilter populates MDC key "correlationId"
# for the lifetime of every request. "-" is printed whenever it's unset (a log line from outside
# any request, e.g. a @Scheduled job) rather than the literal string "null".
logging.pattern.level=%5p [correlationId=%X{correlationId:--}]
spring.security.user.name=disabled
spring.security.user.password=disabled

# OpenAPI paths (whether they're actually served is an environment-specific toggle — see the
# profile-specific files)
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
# P3-1 fix ("management.endpoint.health.show-details=when-authorized + JWT with no roles -- any
# logged-in user sees component details" -- external review, full context in SecurityConfig's own
# updated jwtFilter comment): with this left unset, Spring Boot's own documented fallback treats
# ANY authenticated principal as authorized for full health details, regardless of role -- which
# was effectively the same as "no restriction at all" once every authenticated user carried zero
# granted authorities (the actual root cause, fixed in SecurityConfig). Now genuinely restricted
# to an ADMIN-role user.
management.endpoint.health.roles=ADMIN
# Review finding ("Kubernetes probes"): separates liveness (JVM/application context alive) from
# readiness (Mongo and other dependencies actually reachable) into their own sub-paths —
# /actuator/health/liveness and /actuator/health/readiness — referenced by k8s/deployment.yaml.
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

# Review finding ("richer distributed tracing" -- external review, P3, full context in pom.xml's
# own updated dependency comment): opt-in and disabled by default -- enabling this with no real
# OTLP collector actually listening would mean every trace export attempt fails, adding noise
# and, depending on the exporter's own timeout behavior, latency to real request handling. Set
# TRACING_ENABLED=true and a real OTLP_ENDPOINT to actually turn this on. 10% sampling by
# default (not 100%) -- a reasonable starting point for production trace volume/cost; adjust
# based on your own actual traffic once this is genuinely running against a real backend.
management.tracing.enabled=${TRACING_ENABLED:false}
management.tracing.sampling.probability=${TRACING_SAMPLING_PROBABILITY:0.1}
management.otlp.tracing.endpoint=${OTLP_ENDPOINT:http://localhost:4318/v1/traces}

# Review finding ("Graceful shutdown"): a trading application shouldn't treat container
# termination like a normal web-app restart — mid-flight reconciliation, order placement, or
# emergency-flatten work should get a chance to finish rather than being killed outright.
# This does NOT by itself pause the @Scheduled reconciliation loop or the WebSocket listener —
# those would need their own explicit shutdown hooks to stop initiating new work, which is real
# further scope this doesn't close, stated plainly rather than implied.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
