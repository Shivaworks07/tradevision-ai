# ── Common to every environment ──────────────────────────────────────────
# Environment-specific values (secrets, CORS origins, feature toggles) live in
# application-local.properties and application-prod.properties instead — see SETUP.md.
# P1-16 fix ("Committed secrets + 'local' as default profile" -- confirmed real): this used to
# default to "local" whenever SPRING_PROFILES_ACTIVE was unset, on the reasoning that the
# Dockerfile always overrides it to "prod" for real deployments -- true for THAT one deployment
# path, but not a safe assumption for every way this jar can actually be run: a bare
# `java -jar app.jar` on a server, a different container image, a k8s manifest with a typo'd or
# missing env var, a CI/staging environment nobody thought to configure -- ANY of those would
# silently start with application-local.properties' own publicly-committed JWT secret, AES
# encryption key, admin bootstrap secret, and OTP HMAC key (see that file's own header for why
# they're committed at all), AND print real OTPs straight to the console/logs. Defaulting to
# "prod" instead makes every one of those paths FAIL CLOSED: application-prod.properties (see
# its own header) throws on any unresolved placeholder, so an accidentally-unconfigured
# deployment now refuses to start at all, rather than silently starting with known, public
# secrets protecting real user accounts and real money. The one-time cost: local development now
# requires explicitly exporting SPRING_PROFILES_ACTIVE=local (see SETUP.md and
# application-local.properties' own updated header) -- a small, one-time inconvenience, not an
# ongoing one, and clearly the correct trade-off against a default that can silently expose
# production.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:prod}

spring.application.name=tradevision-backend
server.port=8080
# Spring Boot 4 follow-up (full context in pom.xml's own dated parent-version comment): Boot 4
# splits what used to be one spring.data.mongodb.* prefix in two -- CONNECTION properties
# (uri, database, below) moved to spring.mongodb.*, confirmed directly against Spring Boot
# 4.1.1's own source (org.springframework.boot.mongodb.autoconfigure.MongoProperties,
# @ConfigurationProperties("spring.mongodb")) after an earlier, less careful pass here wrongly
# assumed the whole old prefix moved uniformly -- it did not: DATA/conversion properties (see
# spring.data.mongodb.representation.* just below) stayed under the OLD spring.data.mongodb.*
# prefix (org.springframework.boot.data.mongodb.autoconfigure.DataMongoProperties,
# @ConfigurationProperties("spring.data.mongodb")). Both confirmed by reading Boot 4.1.1's actual
# source, not a summary.
spring.mongodb.database=trade_vision

# Spring Boot 4 / Spring Data MongoDB 5 follow-up, more serious than the property-prefix split
# above: Spring Data MongoDB's own official 4.x-to-5.x migration guide states plainly that it
# "no longer defaults BigInteger/BigDecimal conversion via its configuration support classes...
# the default BigDecimalRepresentation has to be set explicitly" -- confirmed directly against
# Boot 4.1.1's own DataMongoProperties.Representation source, whose bigDecimal field defaults to
# BigDecimalRepresentation.UNSPECIFIED. Left unset, this is a genuinely dangerous silent
# regression for a money-handling application: every BigDecimal field this project persists
# (position quantities, prices, exposure amounts, PnL, risk limits -- effectively every numeric
# field that isn't a plain long/int) would stop being stored as MongoDB's native Decimal128 type
# the way this codebase already assumes throughout (see ExposureReservationService's own
# toDecimal128() helper and every @Field(targetType = FieldType.DECIMAL128) annotation), with no
# compile-time or obvious runtime signal that anything changed. Explicitly restores the
# Decimal128 behavior this codebase was built against and already relies on everywhere else.
spring.data.mongodb.representation.big-decimal=decimal128
# Same migration guide, same "no longer defaults... has to be set explicitly" pattern for UUIDs.
# This project does not currently persist any UUID-typed field, so this has no functional effect
# today, but costs nothing and removes one more "silently different from before" unknown -- set
# to the modern standard representation rather than left to whatever MongoProperties' own
# UuidRepresentation.UNSPECIFIED default resolves to.
spring.mongodb.representation.uuid=standard

# Spring Boot 4 follow-up (full context in pom.xml's own dated parent-version comment, next to
# the spring-boot-jackson2 dependency): keeps Boot's auto-configured Jackson beans on the
# classic Jackson 2 line this project's many direct ObjectMapper/JsonNode usages depend on,
# instead of Boot 4's new Jackson 3 default.
spring.jackson.use-jackson2-defaults=true

# Review finding (P1 #12 — "Frontend authentication is still localStorage-based"): the full fix
# (short-lived access token + HttpOnly Secure SameSite refresh cookie) needs new backend session
# infrastructure — Set-Cookie handling, a CSRF strategy, CORS credentials, and an Angular-wide
# HTTP change — genuinely out of reach to build and verify correctly without a real deployment
# to test against, not something to fake. This is the bounded piece that IS safe to do now:
# shortening the access token's blast radius if it's ever stolen via XSS. 30 minutes, down from
# 24 hours — the frontend's proactive refresh (AuthService.doRefresh) now fires well before that.
app.jwt.expiration=1800000
app.jwt.refresh-expiration=604800000
mail.from.name=TradeVision AI
app.otp.expiry-minutes=5

# P2-21 fix ("Time handling: LocalDateTime.now() everywhere instead of Instant + explicit
# trading-day zone" -- external review, full context in RiskEngineService's own header javadoc):
# the explicit zone a daily-loss-limit reset's "today" is measured in. UTC by default (a neutral,
# DST-free choice for a 24/7 crypto market with no single exchange trading day) -- override if
# your own operator/user base has a different zone they actually think of as "the trading day."
app.trading.day-zone=UTC

# Logging
logging.level.org.mongodb.driver.cluster=WARN
logging.level.org.mongodb.driver.connection=WARN
logging.level.com.tradevision=INFO
# P2-17 fix ("no correlation IDs" -- external review, full context in CorrelationIdFilter's own
# header javadoc): Spring Boot's own documented mechanism for embedding an MDC value into every
# log line without a full logback.xml -- CorrelationIdFilter populates MDC key "correlationId"
# for the lifetime of every request. "-" is printed whenever it's unset (a log line from outside
# any request, e.g. a @Scheduled job) rather than the literal string "null".
logging.pattern.level=%5p [correlationId=%X{correlationId:--}]
spring.security.user.name=disabled
spring.security.user.password=disabled

# OpenAPI paths (whether they're actually served is an environment-specific toggle — see the
# profile-specific files)
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
# P3-1 fix ("management.endpoint.health.show-details=when-authorized + JWT with no roles -- any
# logged-in user sees component details" -- external review, full context in SecurityConfig's own
# updated jwtFilter comment): with this left unset, Spring Boot's own documented fallback treats
# ANY authenticated principal as authorized for full health details, regardless of role -- which
# was effectively the same as "no restriction at all" once every authenticated user carried zero
# granted authorities (the actual root cause, fixed in SecurityConfig). Now genuinely restricted
# to an ADMIN-role user.
management.endpoint.health.roles=ADMIN
# Review finding ("Kubernetes probes"): separates liveness (JVM/application context alive) from
# readiness (Mongo and other dependencies actually reachable) into their own sub-paths —
# /actuator/health/liveness and /actuator/health/readiness — referenced by k8s/deployment.yaml.
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
# Audit item P2 ("health reporting completeness"): external review, confirmed real by direct
# inspection -- the comment above this block already CLAIMED readiness checks "Mongo and other
# dependencies actually reachable," but that was never actually true. Spring Boot's two
# predefined health groups ("liveness"/"readiness") are documented to include ONLY their own
# respective *State indicator by default (LivenessStateHealthIndicator / ReadinessState
# HealthIndicator) -- every other auto-configured HealthIndicator, including the Mongo one
# spring-boot-starter-data-mongodb + actuator already auto-registers under the key "mongo," is
# excluded from both groups unless explicitly added via management.endpoint.health.group.<name>.
# include. Confirmed directly against the actuator jar on this build's own classpath: org.
# springframework.boot.actuate.data.mongo.MongoHealthIndicator is present and auto-configured,
# but was never wired into the readiness group this deployment's own k8s readinessProbe actually
# polls -- meaning a pod with a completely unreachable MongoDB would still report readiness as
# UP (nothing else in the readiness group depends on Mongo either), continuing to receive real
# traffic it cannot actually serve. Fixed by explicitly including it below, which is the one
# config Spring Boot requires for this to work as the comment above always claimed it did.
#
# Deliberately NOT adding tradingWorker (TradingWorkerHealthIndicator) to this group: that
# indicator's own javadoc already establishes, by explicit prior design, that the autonomous
# trading worker's health must stay independent of whether this instance can serve ordinary HTTP
# traffic (liveness must not depend on Binance reachability; the same reasoning applies here --
# a stalled scheduled trading loop is not a reason to pull this pod out of Service rotation and
# stop it from answering login/API requests). That signal remains visible via the default
# /actuator/health aggregate and OpsStatusService, not folded into what gates k8s traffic routing.
management.endpoint.health.group.readiness.include=readinessState,mongo

# Review finding ("richer distributed tracing" -- external review, P3, full context in pom.xml's
# own updated dependency comment): opt-in and disabled by default -- enabling this with no real
# OTLP collector actually listening would mean every trace export attempt fails, adding noise
# and, depending on the exporter's own timeout behavior, latency to real request handling. Set
# TRACING_ENABLED=true and a real OTLP_ENDPOINT to actually turn this on. 10% sampling by
# default (not 100%) -- a reasonable starting point for production trace volume/cost; adjust
# based on your own actual traffic once this is genuinely running against a real backend.
management.tracing.enabled=${TRACING_ENABLED:false}
management.tracing.sampling.probability=${TRACING_SAMPLING_PROBABILITY:0.1}
# Spring Boot 4 follow-up (full context in pom.xml's own dated parent-version comment): property
# renamed from management.otlp.tracing.endpoint now that this project uses Boot 4's own
# spring-boot-starter-opentelemetry instead of the old micrometer-tracing-bridge-otel +
# opentelemetry-exporter-otlp pair -- confirmed against docs.spring.io's 4.0 tracing reference
# and spring.io's "OpenTelemetry with Spring Boot" post, not assumed.
management.opentelemetry.tracing.export.otlp.endpoint=${OTLP_ENDPOINT:http://localhost:4318/v1/traces}

# Review finding ("Graceful shutdown"): a trading application shouldn't treat container
# termination like a normal web-app restart — mid-flight reconciliation, order placement, or
# emergency-flatten work should get a chance to finish rather than being killed outright.
# This does NOT by itself pause the @Scheduled reconciliation loop or the WebSocket listener —
# those would need their own explicit shutdown hooks to stop initiating new work, which is real
# further scope this doesn't close, stated plainly rather than implied.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
