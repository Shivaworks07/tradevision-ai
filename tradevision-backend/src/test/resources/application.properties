# CI-review fix ("MongoDB connection-refused errors from scheduled background reconciliation
# tasks" -- external review, GitHub Actions integration-test failures, "Additional issue"). Full
# mechanism explained in TradeVisionApplication's and SchedulingConfig's own updated javadoc:
# every @SpringBootTest in this codebase -- unit or integration, whatever Spring profile it
# activates with @ActiveProfiles -- used to boot with the SAME real @Scheduled jobs running
# (reconciliation, autonomous scanning, kline/user-data-stream polling, incident retry, etc.) as
# a genuine deployment, including the ~13 Testcontainers-backed integration tests that each point
# at their own short-lived MongoDB container. A test class's container can be stopped by the
# Testcontainers JUnit extension before Spring's own test-context cache has closed that test
# class's ApplicationContext, leaving that context's scheduled jobs (reconciliation chief among
# them, 30s initial delay / 60s fixedDelay) still live and still firing against a now-dead Mongo
# instance for the remainder of a serial suite run -- exactly the repeated connection-refused log
# noise this review flagged.
#
# This file lives ONLY on the test classpath (src/test/resources), never packaged into the
# production jar, so it changes nothing about a real deployment, a `java -jar` run, or a
# developer's own manual "local" profile run -- all of those still default to
# app.scheduling.enabled's own matchIfMissing = true (see SchedulingConfig/
# SchedulingEnablerConfig) and keep running every @Scheduled job exactly as before. This is a
# test-lifecycle fix, not a change to production scheduling cadence, conditions, or behavior.
#
# None of the existing integration tests rely on a @Scheduled method firing on its own timer --
# each one calls the production method under test directly (e.g.
# positionMonitorService.createPositionForLateDiscoveredFill(...),
# positionMonitorService.recoverStuckProtectionAttempts(...)) rather than waiting for the
# scheduler to invoke it, so turning the real timer off changes nothing about what any existing
# test actually exercises or asserts.
app.scheduling.enabled=false
