<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F1525"/>
      <stop offset="100%" stop-color="#141B2D"/>
    </linearGradient>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00D4FF"/>
      <stop offset="100%" stop-color="#7B61FF"/>
    </linearGradient>
    <linearGradient id="bull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00FF88"/>
      <stop offset="100%" stop-color="#00D4FF"/>
    </linearGradient>
  </defs>
  <!-- Background rounded square -->
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>
  <!-- Outer glow ring -->
  <rect width="32" height="32" rx="7" fill="none" stroke="url(#pulse)" stroke-width="0.8" opacity="0.6"/>
  <!-- Candlestick bars: 3 candles showing uptrend -->
  <!-- Candle 1 (left, small red) -->
  <rect x="4" y="20" width="4" height="7" rx="0.8" fill="#FF3B5C" opacity="0.9"/>
  <line x1="6" y1="18.5" x2="6" y2="20" stroke="#FF3B5C" stroke-width="1.2"/>
  <line x1="6" y1="27" x2="6" y2="28.5" stroke="#FF3B5C" stroke-width="1.2"/>
  <!-- Candle 2 (middle, medium green) -->
  <rect x="10" y="15" width="4" height="9" rx="0.8" fill="#00FF88" opacity="0.9"/>
  <line x1="12" y1="13" x2="12" y2="15" stroke="#00FF88" stroke-width="1.2"/>
  <line x1="12" y1="24" x2="12" y2="26" stroke="#00FF88" stroke-width="1.2"/>
  <!-- Candle 3 (right, tall green — breakout) -->
  <rect x="16" y="9" width="4" height="12" rx="0.8" fill="url(#bull)" opacity="1"/>
  <line x1="18" y1="7" x2="18" y2="9" stroke="#00D4FF" stroke-width="1.2"/>
  <line x1="18" y1="21" x2="18" y2="23" stroke="#00D4FF" stroke-width="1.2"/>
  <!-- AI lightning bolt (top right) -->
  <polygon points="24,5 21,14 24.5,14 22,26 28,12.5 24,12.5" fill="url(#pulse)" opacity="0.95"/>
</svg>
